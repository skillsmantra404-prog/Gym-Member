
name: Deploy Gym Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment folder
        run: |
          # Ensure deployment structure exists
          mkdir -p dist/assets/icons

          # Copy PWA configuration
          cp manifest.json dist/manifest.json
          cp service-worker.js dist/service-worker.js

          # Copy icons to expected PWA paths
          cp icon-192.png dist/assets/icons/
          cp icon-512.png dist/assets/icons/
          cp icon-maskable-512.png dist/assets/icons/
          cp favicon-32.png dist/assets/icons/

          # Verify website entry point
          test -f dist/index.html

          echo "Deployment files:"
          find dist -maxdepth 4 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
