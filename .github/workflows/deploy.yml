name: Deploy Gym Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in index.html integrate.py gym-addon.min.js manifest.json service-worker.js icon-192.png icon-512.png icon-maskable-512.png favicon-32.png; do
            test -f "$f" || { echo "::error::Missing file in repo root: $f"; exit 1; }
          done
          # the repo must contain the NEW self-updating service worker, not the old cache-first one
          grep -q "self-updating" service-worker.js || { echo "::error::service-worker.js in the repo is the OLD version. Replace it with the new self-updating one."; exit 1; }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate deployment folder
        run: |
          python integrate.py index.html
          test -f dist/index.html
          grep -q "gym_announcements_v1" dist/index.html || { echo "::error::Add-on is missing from dist/index.html"; exit 1; }

      - name: Prepare deployment folder
        run: |
          mkdir -p dist/assets/icons
          cp manifest.json dist/manifest.json
          cp service-worker.js dist/service-worker.js
          cp icon-192.png dist/assets/icons/
          cp icon-512.png dist/assets/icons/
          cp icon-maskable-512.png dist/assets/icons/
          cp favicon-32.png dist/assets/icons/

      - name: Stamp service worker version (forces every device to update)
        run: |
          sed -i "s/gym-manager-cache/gym-manager-cache-${GITHUB_SHA::7}/" dist/service-worker.js
          grep -n "const CACHE" dist/service-worker.js
          echo "Deployment files:"
          find dist -maxdepth 4 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
